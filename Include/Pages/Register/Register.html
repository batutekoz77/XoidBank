<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account — XoidBank</title>

    <link rel="stylesheet"
          href="/Register/style.css">
</head>

<body>

    <main class="page">

        <section class="register-card">

            <!-- HEADER -->
            <div class="brand">
                <div class="brand-mark">X</div>

                <div>
                    <div class="brand-name">
                        XoidBank
                    </div>

                    <div class="brand-subtitle">
                        Secure banking
                    </div>
                </div>
            </div>


            <!-- TITLE -->
            <div class="heading">

                <span class="eyebrow">
                    JOIN XOIDBANK
                </span>

                <h1>
                    Create your account
                </h1>

                <p>
                    Enter your details to create your
                    secure XoidBank account.
                </p>

            </div>


            <!-- REGISTER FORM -->
            <form id="registerForm" novalidate>


                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="fullName">
                        Full name
                    </label>

                    <div class="input-wrapper">

                        <input type="text"
                               id="fullName"
                               name="fullName"
                               placeholder="John Doe"
                               autocomplete="name"
                               maxlength="100">

                    </div>

                    <span class="error-message"
                          id="fullNameError"></span>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-wrapper">

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="you@example.com"
                               autocomplete="email"
                               maxlength="254">

                    </div>

                    <span class="error-message"
                          id="emailError"></span>

                </div>


                <!-- PHONE -->
                <div class="form-group">

                    <label for="phoneNumber">
                        Phone number
                    </label>

                    <div class="input-wrapper">

                        <input type="tel"
                               id="phoneNumber"
                               name="phoneNumber"
                               placeholder="+31612345678"
                               autocomplete="tel"
                               maxlength="20">

                    </div>

                    <span class="error-message"
                          id="phoneNumberError"></span>

                </div>


                <!-- BSN -->
                <div class="form-group">

                    <label for="BSN">
                        BSN
                    </label>

                    <div class="input-wrapper">

                        <input type="text"
                               id="BSN"
                               name="BSN"
                               placeholder="BSN number"
                               autocomplete="off"
                               maxlength="9">

                    </div>

                    <span class="error-message"
                          id="BSNError"></span>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper password-wrapper">

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               autocomplete="new-password"
                               minlength="6"
                               maxlength="128">

                        <button type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password">
                            <span class="eye-icon"></span>
                        </button>

                    </div>

                    <span class="password-hint">
                        Minimum 6 characters
                    </span>

                    <span class="error-message"
                          id="passwordError"></span>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <div class="input-wrapper">

                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Repeat your password"
                               autocomplete="new-password"
                               minlength="6"
                               maxlength="128">

                    </div>

                    <span class="error-message"
                          id="confirmPasswordError"></span>

                </div>


                <!-- TERMS -->
                <label class="terms"
                       for="terms">

                    <input type="checkbox"
                           id="terms">

                    <span>
                        I agree to the XoidBank terms
                        and privacy policy.
                    </span>

                </label>

                <span class="error-message terms-error"
                      id="termsError"></span>


                <!-- BUTTON -->
                <button type="submit"
                        class="register-button"
                        id="registerButton">

                    <span class="button-text">
                        Create account
                    </span>

                    <span class="button-loader"></span>

                </button>

            </form>


            <!-- FOOTER -->
            <div class="footer">

                <span>
                    Already have an account?
                </span>

                <button type="button"
                        id="loginButton">
                    Sign in
                </button>

            </div>

        </section>

    </main>


    <!-- TOAST -->
    <div class="toast"
         id="toast">
        <span id="toastMessage"></span>
    </div>


    <script src="/Register/script.js"></script>

</body>
</html>
