<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Two-Factor Authentication — XoidBank</title>

    <link rel="stylesheet"
          href="/2FA/style.css">
</head>

<body>

    <main class="page">

        <section class="twofa-card">

            <!-- BRAND -->
            <div class="brand">

                <div class="brand-mark">
                    X
                </div>

                <div>
                    <div class="brand-name">
                        XoidBank
                    </div>

                    <div class="brand-subtitle">
                        Secure banking
                    </div>
                </div>

            </div>


            <!-- HEADING -->
            <div class="heading">

                <span class="eyebrow">
                    SECURITY VERIFICATION
                </span>

                <h1>
                    Verify your identity
                </h1>

                <p>
                    We sent a 4-digit verification code to
                    <strong id="userEmail">
                        your email address
                    </strong>.
                </p>

            </div>


            <!-- 2FA FORM -->
            <form id="twoFAForm"
                  novalidate>

                <div class="code-label">
                    Verification code
                </div>


                <div class="code-inputs">

                    <input type="text"
                           id="code1"
                           maxlength="1"
                           inputmode="numeric"
                           autocomplete="one-time-code">

                    <input type="text"
                           id="code2"
                           maxlength="1"
                           inputmode="numeric">

                    <input type="text"
                           id="code3"
                           maxlength="1"
                           inputmode="numeric">

                    <input type="text"
                           id="code4"
                           maxlength="1"
                           inputmode="numeric">

                </div>


                <span class="error-message"
                      id="codeError">
                </span>


                <!-- TIMER -->
                <div class="timer-container">

                    <span>
                        Code expires in
                    </span>

                    <span id="timer">
                        02:00
                    </span>

                </div>


                <!-- VERIFY -->
                <button type="submit"
                        class="verify-button"
                        id="verifyButton">

                    <span class="button-text">
                        Verify code
                    </span>

                    <span class="button-loader">
                    </span>

                </button>

            </form>


            <!-- FOOTER -->
            <div class="footer">

                <span>
                    Didn't receive the code?
                </span>

                <button type="button"
                        id="backToLogin">
                    Back to login
                </button>

            </div>

        </section>

    </main>


    <!-- TOAST -->
    <div class="toast"
         id="toast">

        <span id="toastMessage">
        </span>

    </div>


    <script src="/2FA/script.js"></script>

</body>

</html>
